name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v4
    permissions:
      contents: write
    with:
      ui-path: "ui"
      # Only attach the built JAR to the GitHub Release. Enable automatic
      # app store sync after the first review passes (remove
      # skip-appstore-release and add app-id + HALO_PAT secret).
      skip-appstore-release: true
