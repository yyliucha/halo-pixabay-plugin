apiVersion: v1alpha1
kind: Setting
metadata:
  name: pixabay-downloader-settings
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: text
          name: apiKey
          label: Pixabay API Key
          validation: required
          help: 在 https://pixabay.com/api/docs/ 页面获取
        - $formkit: text
          name: keywords
          label: 搜索关键词
          value: "mountain,landscape,forest"
          help: 多个关键词用英文逗号分隔
        - $formkit: number
          name: countPerKeyword
          label: 每关键词下载数量
          value: 50
          validation: required|number|min:1
        - $formkit: select
          name: imageSize
          label: 图片尺寸
          value: original
          options:
            - label: 原图
              value: original
            - label: 大图 (~1280px)
              value: large
            - label: 中等 (640px)
              value: webformat
            - label: 缩略图 (150px)
              value: preview
        - $formkit: select
          name: imageType
          label: 图片类型
          value: photo
          options:
            - label: 照片
              value: photo
            - label: 插画
              value: illustration
            - label: 矢量图
              value: vector
            - label: 全部
              value: all
        - $formkit: attachmentPolicySelect
          name: attachmentPolicy
          label: 附件存储策略
          clearable: true
          placeholder: 不指定（自动选择）
          help: 选项自动读取 Halo 存储策略；留空时若只有一个策略会自动选择
        - $formkit: attachmentGroupSelect
          name: attachmentGroup
          label: 附件分组
          clearable: true
          placeholder: 不指定（默认分组）
          help: 选项自动读取 Halo 附件分组；留空时使用默认分组
        - $formkit: checkbox
          name: enabled
          label: 启用定时下载
          value: false
          help: 启用后按下方定时表达式自动下载；首次启用约 1 分钟内会立即执行一次
        - $formkit: text
          name: cron
          label: 定时表达式 (cron)
          value: "0 12 27 * *"
          help: "格式: 分 时 日 月 周（5段）。每5分钟 = */5 * * * *；每天 10:20 = 20 10 * * *；每月27日12:00 = 0 12 27 * *。兼容带秒的6段写法（如 0 20 10 * * ?，自动忽略秒及 ?）"
        - $formkit: repeater
          name: keywordMappings
          label: 关键词映射（按关键词归档）
          help: 为每个关键词独立指定存储策略与附件分组；未配置的关键词使用上方的全局策略/分组
          children:
            - $formkit: text
              name: keyword
              label: 关键词
              validation: required
              help: 与「搜索关键词」中的一个关键词完全一致
            - $formkit: attachmentPolicySelect
              name: policy
              label: 附件存储策略
              clearable: true
              placeholder: 继承全局策略
            - $formkit: attachmentGroupSelect
              name: group
              label: 附件分组
              clearable: true
              placeholder: 继承全局分组
        - $formkit: checkbox
          name: articleCoverEnabled
          label: 发布文章自动配图
          value: false
          help: 开启后，发布无封面文章时自动按文章标签/标题关键词从 Pixabay 寻找并下载一张图片设为文章封面，图片同时进入附件库与去重记录
