# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest

apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  # The name defines how the plugin is invoked, A unique name
  name: pixabay-downloader
spec:
  enabled: true
  requires: ">=2.20.0"
  author:
    name: yyliucha
    website: https://github.com/yyliucha
  logo: logo.svg
  configMapName: pixabay-downloader-configmap
  settingName: pixabay-downloader-settings
  repo: https://github.com/yyliucha/halo-pixabay-plugin
  homepage: https://github.com/yyliucha/halo-pixabay-plugin#readme
  issues: https://github.com/yyliucha/halo-pixabay-plugin/issues
  displayName: "Pixabay 图库"
  description: "定时从 Pixabay 官方 API 下载图片到附件库，支持全局去重、手动触发与下载记录。"
  license:
    - name: "MIT"
      url: "https://github.com/yyliucha/halo-pixabay-plugin/blob/main/LICENSE"
